# nri-prometheus設定ファイル
# このファイルは /etc/nri-prometheus/config.yml に配置されます

# スクレイピング設定
scrape_configs:
  # アプリケーション1のメトリクスエンドポイント
  - job_name: "demo-app"
    scrape_interval: 30s
    metrics_path: "/metrics"
    static_configs:
      - targets:
          # アプリケーションのメトリクスエンドポイントURL
          # ECSサービス名とポートに合わせて変更
          # 例: "demo-app-service:8080" または "http://<IP>:8080"
          - "demo-app-service:8080"
    # メトリクスフィルタリング（デモ用に1メトリクスのみ）
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "http_requests_total"
        action: keep


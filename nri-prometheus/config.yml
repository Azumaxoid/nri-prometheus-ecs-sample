# NRDOT (OpenTelemetry Collector) 設定ファイル
# このファイルは /etc/otelcol/config.yaml に配置されます

receivers:
  prometheus:
    config:
      scrape_configs:
        # アプリケーションのメトリクスエンドポイント
        - job_name: "demo-app"
          scrape_interval: 30s
          metrics_path: "/metrics"
          static_configs:
            - targets:
                # アプリケーションのメトリクスエンドポイントURL
                # docker-compose環境: "demo-app:8080"
                # ECS環境（サイドカー構成）: "localhost:8080"（同じタスク内のコンテナ）
                - "localhost:8080"
          # メトリクスフィルタリング（デモ用に1メトリクスのみ）
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "http_requests_total"
              action: keep

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  # リソース属性の追加（オプション）
  resource:
    attributes:
      - key: service.name
        value: demo-app
        action: upsert

exporters:
  otlp/newrelic:
    endpoint: https://otlp.nr-data.net:4317
    headers:
      api-key: ${NRIA_LICENSE_KEY}
    tls:
      insecure: false

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch, resource]
      exporters: [otlp/newrelic]


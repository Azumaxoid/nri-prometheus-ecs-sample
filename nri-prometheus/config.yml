# nri-prometheus設定ファイル
# このファイルは /etc/nri-prometheus/config.yml に配置されます

# クラスタ名（必須）
clustername: "nri-prometheus-ecs-demo"

# スタンドアロンモード（Infrastructure Agent不要）
standalone: true

# License Keyは環境変数NRIA_LICENSE_KEYから読み取られます
# （設定ファイルには記載しません。ECSタスク定義のsecretsセクションで設定されます）

# スクレイピング設定
scrape_configs:
  # アプリケーション1のメトリクスエンドポイント
  - job_name: "demo-app"
    scrape_interval: 30s
    metrics_path: "/metrics"
    static_configs:
      - targets:
          # アプリケーションのメトリクスエンドポイントURL
          # docker-compose環境: "demo-app:8080"
          # ECS環境: "demo-app-service:8080" または "http://<IP>:8080"
          - "demo-app:8080"
    # メトリクスフィルタリング（デモ用に1メトリクスのみ）
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "http_requests_total"
        action: keep


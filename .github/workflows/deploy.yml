name: Build and Deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECS_CLUSTER_NAME: nri-prometheus-ecs-demo
  APP_ECR_REPO: demo-app
  NRI_ECR_REPO: nri-prometheus
  ECS_TASK_EXECUTION_ROLE: ecsTaskExecutionRole

jobs:
  build-and-deploy:
    runs-on: ${{ vars.RUNNER_LABELS || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.head_ref || github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create ECR repositories if not exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.APP_ECR_REPO }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.APP_ECR_REPO }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256
          
          aws ecr describe-repositories --repository-names ${{ env.NRI_ECR_REPO }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.NRI_ECR_REPO }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "ECR Base: $ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

      - name: Create ECS cluster if not exists
        run: |
          # クラスタが存在するか確認
          if aws ecs describe-clusters --clusters ${{ env.ECS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }} --query 'clusters[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "ECS cluster ${{ env.ECS_CLUSTER_NAME }} already exists"
          else
            echo "Creating ECS cluster: ${{ env.ECS_CLUSTER_NAME }}"
            aws ecs create-cluster \
              --cluster-name ${{ env.ECS_CLUSTER_NAME }} \
              --region ${{ env.AWS_REGION }}
            echo "ECS cluster created"
          fi

      - name: Ensure task execution role has Secrets Manager access
        run: |
          ROLE_NAME="${{ env.ECS_TASK_EXECUTION_ROLE }}"
          ACCOUNT_ID=${{ steps.aws-account.outputs.account-id }}
          REGION=${{ env.AWS_REGION }}
          
          echo "Checking task execution role: $ROLE_NAME"
          
          # Secrets Managerへのアクセス権限を確認
          HAS_SECRETS_ACCESS=$(aws iam list-attached-role-policies \
            --role-name "$ROLE_NAME" \
            --query "AttachedPolicies[?PolicyArn=='arn:aws:iam::aws:policy/SecretsManagerReadWrite'].PolicyArn" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$HAS_SECRETS_ACCESS" ] || [ "$HAS_SECRETS_ACCESS" == "None" ]; then
            echo "Adding Secrets Manager access to task execution role..."
            # Secrets Managerへの読み取り権限を付与
            aws iam attach-role-policy \
              --role-name "$ROLE_NAME" \
              --policy-arn arn:aws:iam::aws:policy/SecretsManagerReadWrite
            echo "✓ SecretsManagerReadWrite policy attached"
          else
            echo "✓ Task execution role already has Secrets Manager access"
          fi
          
          # カスタムポリシーで特定のシークレットへのアクセスのみを許可する場合（オプション）
          # より制限されたアクセスが必要な場合は、以下のコメントを外して使用
          # POLICY_NAME="ecs-task-execution-secrets-access"
          # POLICY_DOCUMENT=$(cat <<EOF
          # {
          #   "Version": "2012-10-17",
          #   "Statement": [
          #     {
          #       "Effect": "Allow",
          #       "Action": [
          #         "secretsmanager:GetSecretValue"
          #       ],
          #       "Resource": "arn:aws:secretsmanager:${REGION}:${ACCOUNT_ID}:secret:newrelic/ecs-demo-license-key*"
          #     }
          #   ]
          # }
          # EOF
          # )
          # aws iam put-role-policy \
          #   --role-name "$ROLE_NAME" \
          #   --policy-name "$POLICY_NAME" \
          #   --policy-document "$POLICY_DOCUMENT"

      - name: Create or update Secrets Manager secret
        id: secrets-manager
        run: |
          if [ -z "${{ secrets.NEW_RELIC_LICENSE_KEY }}" ]; then
            echo "NEW_RELIC_LICENSE_KEY secret is not set. Skipping Secrets Manager setup."
            exit 0
          fi
          SECRET_NAME="newrelic/ecs-demo-license-key"
          # シークレットが存在するか確認
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Updating existing secret: $SECRET_NAME"
            aws secretsmanager update-secret \
              --secret-id "$SECRET_NAME" \
              --secret-string "${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
              --region ${{ env.AWS_REGION }}
          else
            echo "Creating new secret: $SECRET_NAME"
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --secret-string "${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
              --region ${{ env.AWS_REGION }}
          fi
          
          # 実際のARN（サフィックス付き）を取得
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --region ${{ env.AWS_REGION }} \
            --query 'ARN' \
            --output text)
          echo "Secret ARN: $SECRET_ARN"
          echo "secret-arn=$SECRET_ARN" >> $GITHUB_OUTPUT

      - name: Build and push demo-app image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP_ECR_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP_ECR_REPO }}:latest

      - name: Update nri-prometheus config with license key
        run: |
          if [ -n "${{ secrets.NEW_RELIC_LICENSE_KEY }}" ]; then
            # 設定ファイルにLicense Keyを書き込む
            sed -i "s|license_key: \"\"|license_key: \"${{ secrets.NEW_RELIC_LICENSE_KEY }}\"|g" nri-prometheus/config.yml
            echo "License key written to config file"
          else
            echo "NEW_RELIC_LICENSE_KEY not set, keeping empty license_key in config"
          fi

      - name: Build and push nri-prometheus image
        uses: docker/build-push-action@v5
        with:
          context: ./nri-prometheus
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.NRI_ECR_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.NRI_ECR_REPO }}:latest

      - name: Update ECS task definitions
        run: |
          ACCOUNT_ID=${{ steps.aws-account.outputs.account-id }}
          REGION=${{ env.AWS_REGION }}
          EXECUTION_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${{ env.ECS_TASK_EXECUTION_ROLE }}"
          
          # Secrets ManagerのARNを取得（サフィックス付き）
          SECRET_ARN="${{ steps.secrets-manager.outputs.secret-arn }}"
          if [ -z "$SECRET_ARN" ] || [ "$SECRET_ARN" == "" ]; then
            # フォールバック: シークレット名からARNを構築（サフィックスなし）
            SECRET_ARN="arn:aws:secretsmanager:${REGION}:${ACCOUNT_ID}:secret:newrelic/ecs-demo-license-key"
            echo "Warning: Could not get secret ARN, using fallback: $SECRET_ARN"
          fi
          
          # アプリケーションタスク定義の更新（nri-prometheusはサイドカーとして含まれています）
          sed -i "s|YOUR_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com|${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com|g" ecs/app-task-definition.json
          sed -i "s|YOUR_REGION|${REGION}|g" ecs/app-task-definition.json
          sed -i "s|arn:aws:iam::YOUR_ACCOUNT_ID:role/ecsTaskExecutionRole|${EXECUTION_ROLE_ARN}|g" ecs/app-task-definition.json
          
          # Secrets ManagerのARNを更新（サフィックス付きの実際のARNを使用）
          sed -i "s|YOUR_SECRET_ARN|${SECRET_ARN}|g" ecs/app-task-definition.json

      - name: Create CloudWatch Logs groups
        run: |
          aws logs create-log-group --log-group-name "/ecs/demo-app" --region ${{ env.AWS_REGION }} || true
          # サイドカー構成では、nri-prometheusはアプリケーションと同じロググループを使用します

      - name: Register ECS task definitions
        run: |
          # アプリケーションタスク定義を登録（nri-prometheusはサイドカーとして含まれています）
          aws ecs register-task-definition \
            --cli-input-json file://ecs/app-task-definition.json \
            --region ${{ env.AWS_REGION }}

      - name: Get or create network resources
        id: network
        run: |
          # サブネットIDを取得（デフォルトサブネットまたは最初のサブネット）
          SUBNET_ID=$(aws ec2 describe-subnets \
            --region ${{ env.AWS_REGION }} \
            --filters "Name=default-for-az,Values=true" \
            --query "Subnets[0].SubnetId" \
            --output text 2>/dev/null || \
          aws ec2 describe-subnets \
            --region ${{ env.AWS_REGION }} \
            --query "Subnets[0].SubnetId" \
            --output text)
          
          if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" == "None" ]; then
            echo "Error: Could not find a subnet"
            exit 1
          fi
          echo "subnet-id=$SUBNET_ID" >> $GITHUB_OUTPUT
          echo "Using subnet: $SUBNET_ID"
          
          # VPC IDを取得
          VPC_ID=$(aws ec2 describe-subnets \
            --subnet-ids "$SUBNET_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "Subnets[0].VpcId" \
            --output text)
          
          # セキュリティグループを作成または取得
          SG_NAME="ecs-demo-${{ env.ECS_CLUSTER_NAME }}-sg"
          SG_ID=$(aws ec2 create-security-group \
            --group-name "$SG_NAME" \
            --description "Security group for ECS demo cluster ${{ env.ECS_CLUSTER_NAME }}" \
            --vpc-id "$VPC_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'GroupId' \
            --output text 2>/dev/null || \
          aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$SG_NAME" "Name=vpc-id,Values=$VPC_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "SecurityGroups[0].GroupId" \
            --output text)
          
          if [ -z "$SG_ID" ] || [ "$SG_ID" == "None" ]; then
            echo "Error: Could not create or find security group"
            exit 1
          fi
          echo "security-group-id=$SG_ID" >> $GITHUB_OUTPUT
          echo "Using security group: $SG_ID"
          
          # セキュリティグループにルールを追加
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 8080 \
            --cidr 0.0.0.0/0 \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Port 8080 rule may already exist"
          
          aws ec2 authorize-security-group-egress \
            --group-id "$SG_ID" \
            --protocol -1 \
            --cidr 0.0.0.0/0 \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Egress rule may already exist"

      - name: Create or update ECS services
        run: |
          SUBNET_ID="${{ steps.network.outputs.subnet-id }}"
          SG_ID="${{ steps.network.outputs.security-group-id }}"
          
          # アプリケーションサービスの作成または更新
          if aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services demo-app-service \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status' \
            --output text 2>/dev/null | grep -q ACTIVE; then
            echo "Updating demo-app-service..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --service demo-app-service \
              --task-definition demo-app \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
          else
            echo "Creating demo-app-service..."
            aws ecs create-service \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --service-name demo-app-service \
              --task-definition demo-app \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
              --region ${{ env.AWS_REGION }}
          fi
          
          # 注意: サイドカー構成では、nri-prometheusは独立したサービスではなく、
          # アプリケーションタスク定義内に含まれています

      - name: Check task status and troubleshoot
        run: |
          echo "Checking task status..."
          sleep 10
          
          # アプリケーションサービスの状態を確認
          echo "=== Checking demo-app-service ==="
          APP_SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services demo-app-service \
            --region ${{ env.AWS_REGION }} \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "NOT_FOUND")
          
          echo "demo-app-service status: $APP_SERVICE_STATUS"
          
          if [ "$APP_SERVICE_STATUS" == "ACTIVE" ]; then
            APP_RUNNING_COUNT=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --services demo-app-service \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].runningCount" \
              --output text)
            APP_DESIRED_COUNT=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --services demo-app-service \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].desiredCount" \
              --output text)
            echo "Running tasks: $APP_RUNNING_COUNT / Desired: $APP_DESIRED_COUNT"
            
            if [ "$APP_RUNNING_COUNT" -eq 0 ]; then
              echo "⚠️  No running tasks. Checking stopped tasks..."
              APP_TASK_ARN=$(aws ecs list-tasks \
                --cluster ${{ env.ECS_CLUSTER_NAME }} \
                --service-name demo-app-service \
                --desired-status STOPPED \
                --region ${{ env.AWS_REGION }} \
                --query "taskArns[0]" \
                --output text 2>/dev/null || echo "")
              
              if [ -n "$APP_TASK_ARN" ] && [ "$APP_TASK_ARN" != "None" ]; then
                STOPPED_REASON=$(aws ecs describe-tasks \
                  --cluster ${{ env.ECS_CLUSTER_NAME }} \
                  --tasks "$APP_TASK_ARN" \
                  --region ${{ env.AWS_REGION }} \
                  --query "tasks[0].stoppedReason" \
                  --output text)
                echo "Last stopped reason: $STOPPED_REASON"
              fi
            fi
          fi
          
          # サイドカー構成では、nri-prometheusはアプリケーションタスク内に含まれています
          echo ""
          echo "=== Checking nri-prometheus sidecar container ==="
          
          if [ -n "$APP_TASK_ARN" ] && [ "$APP_TASK_ARN" != "None" ]; then
            # タスク内の全コンテナの状態を確認
            echo "Checking containers in demo-app task..."
            aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --tasks "$APP_TASK_ARN" \
              --region ${{ env.AWS_REGION }} \
              --query "tasks[0].containers[*].[name,lastStatus,healthStatus,reason]" \
              --output table || true
          else
            echo "No demo-app task found yet. nri-prometheus will start with the app task."
          fi
          
          # Secrets Managerのシークレットが存在するか確認
          echo ""
          echo "Checking Secrets Manager secret..."
          if aws secretsmanager describe-secret \
            --secret-id "newrelic/ecs-demo-license-key" \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✓ Secrets Manager secret exists"
          else
            echo "✗ Secrets Manager secret 'newrelic/ecs-demo-license-key' does not exist"
            echo "  Please create it or set NEW_RELIC_LICENSE_KEY in GitHub Secrets"
          fi
          
          # nri-prometheusのログを確認（サイドカー構成ではアプリケーションと同じロググループ）
          echo ""
          echo "=== nri-prometheus CloudWatch Logs (last 50 lines, filtered) ==="
          LOG_STREAM=$(aws logs describe-log-streams \
            --log-group-name "/ecs/demo-app" \
            --region ${{ env.AWS_REGION }} \
            --order-by LastEventTime \
            --descending \
            --max-items 1 \
            --query "logStreams[0].logStreamName" \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$LOG_STREAM" ] && [ "$LOG_STREAM" != "None" ]; then
            echo "Log stream: $LOG_STREAM"
            aws logs get-log-events \
              --log-group-name "/ecs/demo-app" \
              --log-stream-name "$LOG_STREAM" \
              --region ${{ env.AWS_REGION }} \
              --limit 50 \
              --query "events[*].message" \
              --output text 2>/dev/null | grep -i "nri-prometheus" || echo "No nri-prometheus logs found yet"
          else
            echo "No log stream found yet"
          fi

      - name: Get application access info
        id: app-info
        run: |
          echo "Waiting for service to stabilize after deployment..."
          
          # サービスの状態を監視して、新しいタスクが起動するまで待つ
          MAX_WAIT_TIME=300  # 最大5分
          CHECK_INTERVAL=10  # 10秒ごとにチェック
          ELAPSED=0
          LAST_TASK_ARN=""
          STABLE_COUNT=0
          
          echo "Monitoring service for new task deployment..."
          
          while [ $ELAPSED -lt $MAX_WAIT_TIME ]; do
            # サービスの状態を確認
            SERVICE_STATUS=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --services demo-app-service \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].[status,runningCount,desiredCount]" \
              --output text 2>/dev/null || echo "UNKNOWN 0 0")
            
            STATUS=$(echo $SERVICE_STATUS | cut -d' ' -f1)
            RUNNING_COUNT=$(echo $SERVICE_STATUS | cut -d' ' -f2)
            DESIRED_COUNT=$(echo $SERVICE_STATUS | cut -d' ' -f3)
            
            echo "[${ELAPSED}s] Status: $STATUS, Running: $RUNNING_COUNT/$DESIRED_COUNT"
            
            # 実行中のタスクを取得
            APP_TASK_ARN=$(aws ecs list-tasks \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --service-name demo-app-service \
              --desired-status RUNNING \
              --region ${{ env.AWS_REGION }} \
              --query "taskArns[0]" \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$APP_TASK_ARN" ] && [ "$APP_TASK_ARN" != "None" ]; then
              # タスクの状態を確認
              TASK_STATUS=$(aws ecs describe-tasks \
                --cluster ${{ env.ECS_CLUSTER_NAME }} \
                --tasks "$APP_TASK_ARN" \
                --region ${{ env.AWS_REGION }} \
                --query "tasks[0].lastStatus" \
                --output text 2>/dev/null || echo "UNKNOWN")
              
              if [ "$TASK_STATUS" == "RUNNING" ]; then
                # タスクが変わったか確認（再作成された場合）
                if [ "$APP_TASK_ARN" != "$LAST_TASK_ARN" ]; then
                  echo "New task detected: $APP_TASK_ARN"
                  LAST_TASK_ARN="$APP_TASK_ARN"
                  STABLE_COUNT=0
                else
                  STABLE_COUNT=$((STABLE_COUNT + 1))
                  # 同じタスクが30秒以上安定している場合、準備完了とみなす
                  if [ $STABLE_COUNT -ge 3 ]; then
                    echo "Task is stable. Getting access information..."
                    break
                  fi
                fi
              fi
            fi
            
            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done
          
          if [ -n "$APP_TASK_ARN" ] && [ "$APP_TASK_ARN" != "None" ]; then
            # タスクのENI IDを取得
            ENI_ID=$(aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --tasks "$APP_TASK_ARN" \
              --region ${{ env.AWS_REGION }} \
              --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$ENI_ID" ] && [ "$ENI_ID" != "None" ]; then
              # パブリックIPを取得（最大3回リトライ）
              PUBLIC_IP=""
              for i in 1 2 3; do
                PUBLIC_IP=$(aws ec2 describe-network-interfaces \
                  --network-interface-ids "$ENI_ID" \
                  --region ${{ env.AWS_REGION }} \
                  --query "NetworkInterfaces[0].Association.PublicIp" \
                  --output text 2>/dev/null || echo "")
                
                if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
                  break
                fi
                echo "Waiting for public IP assignment... (attempt $i/3)"
                sleep 5
              done
              
              if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
                echo "app-public-ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
                echo "✓ Application is accessible at: http://$PUBLIC_IP:8080"
                echo "✓ Metrics endpoint: http://$PUBLIC_IP:8080/metrics"
                
                # アクセステスト（最大3回リトライ）
                for i in 1 2 3; do
                  if curl -s -f -m 5 "http://$PUBLIC_IP:8080/health" > /dev/null; then
                    echo "✓ Health check passed"
                    break
                  else
                    if [ $i -lt 3 ]; then
                      echo "Health check failed, retrying in 5 seconds... (attempt $i/3)"
                      sleep 5
                    else
                      echo "⚠️  Health check failed - application may still be starting"
                    fi
                  fi
                done
              else
                echo "⚠️  Public IP not yet assigned. Please check AWS console."
              fi
            else
              echo "⚠️  Could not get network interface ID"
            fi
          else
            echo "⚠️  No running tasks found after waiting. Checking service status..."
            aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --services demo-app-service \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].[status,runningCount,desiredCount,events[0].message]" \
              --output table || true
            echo ""
            echo "To manually get the access URL, run:"
            echo "  TASK_ARN=\$(aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER_NAME }} --service-name demo-app-service --region ${{ env.AWS_REGION }} --query 'taskArns[0]' --output text)"
            echo "  ENI_ID=\$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER_NAME }} --tasks \$TASK_ARN --region ${{ env.AWS_REGION }} --query 'tasks[0].attachments[0].details[?name==\`networkInterfaceId\`].value' --output text)"
            echo "  PUBLIC_IP=\$(aws ec2 describe-network-interfaces --network-interface-ids \$ENI_ID --region ${{ env.AWS_REGION }} --query 'NetworkInterfaces[0].Association.PublicIp' --output text)"
            echo "  echo \"App URL: http://\${PUBLIC_IP}:8080\""
          fi

      - name: Output deployment info
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App Image**: \`${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP_ECR_REPO }}:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **nri-prometheus Image**: \`${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.NRI_ECR_REPO }}:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Cluster**: \`${{ env.ECS_CLUSTER_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.app-info.outputs.app-public-ip }}" ]; then
            echo "## Application Access" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Application URL**: http://${{ steps.app-info.outputs.app-public-ip }}:8080" >> $GITHUB_STEP_SUMMARY
            echo "- **Metrics Endpoint**: http://${{ steps.app-info.outputs.app-public-ip }}:8080/metrics" >> $GITHUB_STEP_SUMMARY
            echo "- **Health Check**: http://${{ steps.app-info.outputs.app-public-ip }}:8080/health" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Application Access" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Task is still starting. To get the access URL, run:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "TASK_ARN=\$(aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER_NAME }} --service-name demo-app-service --region ${{ env.AWS_REGION }} --query 'taskArns[0]' --output text)" >> $GITHUB_STEP_SUMMARY
            echo "ENI_ID=\$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER_NAME }} --tasks \$TASK_ARN --region ${{ env.AWS_REGION }} --query 'tasks[0].attachments[0].details[?name==\`networkInterfaceId\`].value' --output text)" >> $GITHUB_STEP_SUMMARY
            echo "PUBLIC_IP=\$(aws ec2 describe-network-interfaces --network-interface-ids \$ENI_ID --region ${{ env.AWS_REGION }} --query 'NetworkInterfaces[0].Association.PublicIp' --output text)" >> $GITHUB_STEP_SUMMARY
            echo "echo \"App URL: http://\${PUBLIC_IP}:8080\"" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi


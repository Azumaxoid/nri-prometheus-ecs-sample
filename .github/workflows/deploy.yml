name: Build and Deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECS_CLUSTER_NAME: demo-ecs-cluster
  APP_ECR_REPO: demo-app
  NRI_ECR_REPO: nri-prometheus
  ECS_TASK_EXECUTION_ROLE: ecsTaskExecutionRole

jobs:
  build-and-deploy:
    runs-on: ${{ vars.RUNNER_LABELS || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.head_ref || github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create ECR repositories if not exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.APP_ECR_REPO }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.APP_ECR_REPO }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256
          
          aws ecr describe-repositories --repository-names ${{ env.NRI_ECR_REPO }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.NRI_ECR_REPO }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "ECR Base: $ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

      - name: Create ECS cluster if not exists
        run: |
          # クラスタが存在するか確認
          if aws ecs describe-clusters --clusters ${{ env.ECS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }} --query 'clusters[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "ECS cluster ${{ env.ECS_CLUSTER_NAME }} already exists"
          else
            echo "Creating ECS cluster: ${{ env.ECS_CLUSTER_NAME }}"
            aws ecs create-cluster \
              --cluster-name ${{ env.ECS_CLUSTER_NAME }} \
              --region ${{ env.AWS_REGION }}
            echo "ECS cluster created"
          fi

      - name: Create or update Secrets Manager secret
        run: |
          if [ -z "${{ secrets.NEW_RELIC_LICENSE_KEY }}" ]; then
            echo "NEW_RELIC_LICENSE_KEY secret is not set. Skipping Secrets Manager setup."
            exit 0
          fi
          SECRET_NAME="newrelic/ecs-demo-license-key"
          # シークレットが存在するか確認
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Updating existing secret: $SECRET_NAME"
            aws secretsmanager update-secret \
              --secret-id "$SECRET_NAME" \
              --secret-string "${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
              --region ${{ env.AWS_REGION }}
          else
            echo "Creating new secret: $SECRET_NAME"
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --secret-string "${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
              --region ${{ env.AWS_REGION }}
          fi

      - name: Build and push demo-app image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP_ECR_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP_ECR_REPO }}:latest

      - name: Build and push nri-prometheus image
        uses: docker/build-push-action@v5
        with:
          context: ./nri-prometheus
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.NRI_ECR_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.NRI_ECR_REPO }}:latest

      - name: Update ECS task definitions
        run: |
          ACCOUNT_ID=${{ steps.aws-account.outputs.account-id }}
          REGION=${{ env.AWS_REGION }}
          EXECUTION_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${{ env.ECS_TASK_EXECUTION_ROLE }}"
          
          # アプリケーションタスク定義の更新
          sed -i "s|YOUR_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com|${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com|g" ecs/app-task-definition.json
          sed -i "s|YOUR_REGION|${REGION}|g" ecs/app-task-definition.json
          sed -i "s|arn:aws:iam::YOUR_ACCOUNT_ID:role/ecsTaskExecutionRole|${EXECUTION_ROLE_ARN}|g" ecs/app-task-definition.json
          
          # nri-prometheusタスク定義の更新
          sed -i "s|YOUR_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com|${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com|g" ecs/nri-prometheus-task-definition-simple.json
          sed -i "s|YOUR_REGION|${REGION}|g" ecs/nri-prometheus-task-definition-simple.json
          sed -i "s|YOUR_ACCOUNT_ID|${ACCOUNT_ID}|g" ecs/nri-prometheus-task-definition-simple.json
          sed -i "s|arn:aws:iam::YOUR_ACCOUNT_ID:role/ecsTaskExecutionRole|${EXECUTION_ROLE_ARN}|g" ecs/nri-prometheus-task-definition-simple.json
          
          # Secrets ManagerのARNを更新
          sed -i "s|arn:aws:secretsmanager:YOUR_REGION:YOUR_ACCOUNT_ID:secret:newrelic/ecs-demo-license-key|arn:aws:secretsmanager:${REGION}:${ACCOUNT_ID}:secret:newrelic/ecs-demo-license-key|g" ecs/nri-prometheus-task-definition-simple.json

      - name: Create CloudWatch Logs groups
        run: |
          aws logs create-log-group --log-group-name "/ecs/demo-app" --region ${{ env.AWS_REGION }} || true
          aws logs create-log-group --log-group-name "/ecs/nri-prometheus" --region ${{ env.AWS_REGION }} || true

      - name: Register ECS task definitions
        run: |
          # アプリケーションタスク定義を登録
          aws ecs register-task-definition \
            --cli-input-json file://ecs/app-task-definition.json \
            --region ${{ env.AWS_REGION }}
          
          # nri-prometheusタスク定義を登録
          aws ecs register-task-definition \
            --cli-input-json file://ecs/nri-prometheus-task-definition-simple.json \
            --region ${{ env.AWS_REGION }}

      - name: Get or create network resources
        id: network
        run: |
          # サブネットIDを取得（デフォルトサブネットまたは最初のサブネット）
          SUBNET_ID=$(aws ec2 describe-subnets \
            --region ${{ env.AWS_REGION }} \
            --filters "Name=default-for-az,Values=true" \
            --query "Subnets[0].SubnetId" \
            --output text 2>/dev/null || \
          aws ec2 describe-subnets \
            --region ${{ env.AWS_REGION }} \
            --query "Subnets[0].SubnetId" \
            --output text)
          
          if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" == "None" ]; then
            echo "Error: Could not find a subnet"
            exit 1
          fi
          echo "subnet-id=$SUBNET_ID" >> $GITHUB_OUTPUT
          echo "Using subnet: $SUBNET_ID"
          
          # VPC IDを取得
          VPC_ID=$(aws ec2 describe-subnets \
            --subnet-ids "$SUBNET_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "Subnets[0].VpcId" \
            --output text)
          
          # セキュリティグループを作成または取得
          SG_NAME="ecs-demo-${{ env.ECS_CLUSTER_NAME }}-sg"
          SG_ID=$(aws ec2 create-security-group \
            --group-name "$SG_NAME" \
            --description "Security group for ECS demo cluster ${{ env.ECS_CLUSTER_NAME }}" \
            --vpc-id "$VPC_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'GroupId' \
            --output text 2>/dev/null || \
          aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$SG_NAME" "Name=vpc-id,Values=$VPC_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "SecurityGroups[0].GroupId" \
            --output text)
          
          if [ -z "$SG_ID" ] || [ "$SG_ID" == "None" ]; then
            echo "Error: Could not create or find security group"
            exit 1
          fi
          echo "security-group-id=$SG_ID" >> $GITHUB_OUTPUT
          echo "Using security group: $SG_ID"
          
          # セキュリティグループにルールを追加
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 8080 \
            --cidr 0.0.0.0/0 \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Port 8080 rule may already exist"
          
          aws ec2 authorize-security-group-egress \
            --group-id "$SG_ID" \
            --protocol -1 \
            --cidr 0.0.0.0/0 \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Egress rule may already exist"

      - name: Create or update ECS services
        run: |
          SUBNET_ID="${{ steps.network.outputs.subnet-id }}"
          SG_ID="${{ steps.network.outputs.security-group-id }}"
          
          # アプリケーションサービスの作成または更新
          if aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services demo-app-service \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status' \
            --output text 2>/dev/null | grep -q ACTIVE; then
            echo "Updating demo-app-service..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --service demo-app-service \
              --task-definition demo-app \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
          else
            echo "Creating demo-app-service..."
            aws ecs create-service \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --service-name demo-app-service \
              --task-definition demo-app \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
              --region ${{ env.AWS_REGION }}
          fi
          
          # nri-prometheusサービスの作成または更新
          if aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services nri-prometheus-service \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status' \
            --output text 2>/dev/null | grep -q ACTIVE; then
            echo "Updating nri-prometheus-service..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --service nri-prometheus-service \
              --task-definition nri-prometheus \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
          else
            echo "Creating nri-prometheus-service..."
            aws ecs create-service \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --service-name nri-prometheus-service \
              --task-definition nri-prometheus \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
              --region ${{ env.AWS_REGION }}
          fi

      - name: Output deployment info
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App Image**: \`${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP_ECR_REPO }}:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **nri-prometheus Image**: \`${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.NRI_ECR_REPO }}:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Cluster**: \`${{ env.ECS_CLUSTER_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY


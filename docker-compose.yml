version: '3.8'

services:
  demo-app:
    build:
      context: ./app
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: demo-app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - demo-network

  nrdot:
    build:
      context: ./nri-prometheus
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: nrdot
    environment:
      - NRIA_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
    depends_on:
      - demo-app
    networks:
      - demo-network

networks:
  demo-network:
    driver: bridge

